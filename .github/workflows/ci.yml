name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no workflow-level env block. Placeholder Supabase credentials
# are set only on the `build` job, which needs them to prerender. Exporting
# them globally leaked build configuration into the unit tests and changed how
# far the code got before failing, which is a property no test should depend
# on.

jobs:
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:web
      - run: pnpm lint:app
      # Covers the root project plus both apps. Before the fork removal the
      # root tsconfig excluded apps, packages and tests, so this checked only
      # code that shipped nowhere.
      - run: pnpm typecheck

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test:integration
      # Structural authorization guard; needs no database.
      - run: pnpm exec vitest run tests/security/server-action-authorization.test.ts

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The whole point of this job: prove the chain applies to an empty
      # database in filename order, every time, rather than assuming it.
      #
      # A fresh runner has no Docker volume, so `supabase start` IS the
      # from-empty application of every migration. A second `db reset` was
      # redundant, and `--no-seed` is not accepted by every CLI version, so it
      # failed the job while proving nothing the start had not already proven.
      - name: Start local Supabase, applying every migration from empty
        run: supabase start

      # Supabase names the container supabase_db_<project_id>. Resolve it from
      # Docker rather than hardcoding, and export it so the test suites use the
      # same one.
      - name: Resolve the Supabase database container
        run: |
          set -euo pipefail
          name=$(docker ps --filter "name=supabase_db_" --format '{{.Names}}' | head -n1)
          if [ -z "$name" ]; then
            docker ps
            echo "::error::no supabase_db_* container is running"
            exit 1
          fi
          echo "Using container: $name"
          echo "SUPABASE_DB_CONTAINER=$name" >> "$GITHUB_ENV"

      # Fail loudly if the chain silently stopped short.
      - name: Confirm every migration is recorded as applied
        run: |
          set -euo pipefail
          expected=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(docker exec "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -tAc \
            "select count(*) from supabase_migrations.schema_migrations" | tr -d '[:space:]')
          echo "migrations on disk: $expected, applied: $applied"
          if [ "$expected" -ne "$applied" ]; then
            docker exec "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -c \
              "select version from supabase_migrations.schema_migrations order by version"
            echo "::error::migration count mismatch — the chain did not fully apply"
            exit 1
          fi

      # These shell into the container and fail — never skip — if it is absent.
      - name: RLS and tenant isolation
        run: pnpm exec vitest run tests/security/rls-coverage.test.ts

      - name: Release behaviour (conversion, replay identity, outbox lifecycle)
        run: pnpm exec vitest run tests/security/release-behavior.test.ts

      - name: Anonymous inquiry RLS
        run: pnpm exec vitest run tests/security/anonymous-inquiry-rls.test.ts

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  build:
    name: Build both apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm build:app
    env:
      # Structurally valid placeholders so Next can prerender. No request path
      # can reach a real project; everything fails closed. Scoped to this job
      # only — see the note above `jobs:`.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_APP_URL: http://localhost:3001

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # critical-flows.spec.ts asserts /api/health reports db: "ok", and the
      # auth pages need a reachable Supabase to render meaningfully. Without
      # this the suite fails for want of a database rather than for a defect.
      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - run: pnpm test:e2e:install

      # Built against the live local Supabase, then served with `next start`
      # by playwright.config.ts. Building here rather than reusing the build
      # job because the NEXT_PUBLIC_* values are baked in at build time and
      # that job uses placeholders.
      - run: pnpm build:web
      - run: pnpm build:app

      - run: pnpm test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
